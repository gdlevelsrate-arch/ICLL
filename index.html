<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICLL V8</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
    margin: 0;
}

#loader {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2rem;
}

.card {
    background: #222;
    margin: 20px auto;
    padding: 20px;
    border-radius: 10px;
    width: 300px;
}
</style>
</head>
<body>

<div id="loader">Loading ICLL V8...</div>

<h1>ICLL V8 Demo</h1>

<div class="card">
    <h2>Level Review</h2>
    <p id="result">Pending Review</p>
    <button onclick="reviewLevel()">Review Level</button>
</div>

<script>
window.addEventListener("load", () => {
    setTimeout(() => {
        document.getElementById("loader").style.display = "none";
    }, 2000);
});

function reviewLevel() {
    const accepted = Math.random() > 0.5;

    document.getElementById("result").textContent =
        accepted ? "Accepted ✅" : "Rejected ❌";
}
</script>

</body>
</html>
